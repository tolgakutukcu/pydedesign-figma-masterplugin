    up: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5L6 4.5l3 3"/></svg>',
    down: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5L6 7.5l3-3"/></svg>',
    del: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3.5h7M5 3.5V2.5h2v1M3.5 3.5l.5 6h4l.5-6"/></svg>'
  };

  const t = () => S[lang];
  let token;            // undefined until code.js answers, then a string or null
  let tab = 'checklist';
  let busy = null;      // 'connect' | 'load' | 'publish'
  let msg = null;       // { kind: 'ok' | 'err', title, text } banner
  let loaded = false;

  // Checklist rows: { id, tr, en, legacy, orig: { tr, en } | null (new), deleted, key }
  const cl = { sha: null, rows: [], base: '', baseIds: [] };
  // Team: { sha, names, base, added: Set }
  const tm = { sha: null, names: [], base: '', added: new Set() };
  let keySeq = 0;

  // ---------- GitHub ----------

  function fromB64(b64) {
    const bin = atob(String(b64).replace(/\s/g, ''));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function toB64(str) {
    let bin = '';
    new TextEncoder().encode(str).forEach((b) => { bin += String.fromCharCode(b); });
    return btoa(bin);
  }

  function api(path, opts) {
    return fetch(API + path, Object.assign({
      cache: 'no-store',
      headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }
    }, opts || {}));
  }

  async function readFile(name) {
    const res = await api('/contents/' + FILES[name] + '?ref=main');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    return { sha: j.sha, data: JSON.parse(fromB64(j.content)) };
  }

  // Returns 'ok' | 'conflict' | an error text.
  async function writeFile(name, text, message) {
    const sha = name === 'checklist' ? cl.sha : tm.sha;
    const res = await api('/contents/' + FILES[name], {
      method: 'PUT',
      body: JSON.stringify({ message, content: toB64(text), sha, branch: 'main' })
    });
    if (res.status === 409) return 'conflict';
    if (!res.ok) {
      let detail = '';
      try { detail = (await res.json()).message || ''; } catch (e) {}
      return 'HTTP ' + res.status + (detail ? ': ' + detail : '');
    }
    const j = await res.json();
    if (name === 'checklist') cl.sha = j.content.sha; else tm.sha = j.content.sha;
    return 'ok';
  }

  // ---------- Checklist model ----------

  function slug(s) {
    return s.toLocaleLowerCase('tr').replace(/ı/g, 'i').normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'item';
  }
  // New ids get a short random tail, so a new item never takes over the checks of an old, removed item.
  function newId(text, used) {
    let id;
    do { id = slug(text) + '-' + Math.random().toString(36).slice(2, 6); } while (used.has(id));
    used.add(id);
    return id;
  }

  function setChecklist(data, sha) {
    cl.sha = sha;
    cl.rows = (Array.isArray(data) ? data : []).filter((i) => i && typeof i.id === 'string').map((i) => ({
      id: i.id, tr: i.tr || '', en: i.en || '', legacy: i.legacy,
      orig: { tr: i.tr || '', en: i.en || '' }, deleted: false, key: ++keySeq
    }));
    cl.base = serializeChecklist(checklistItems(false).items);
    cl.baseIds = cl.rows.map((r) => r.id);
  }

  // The list as it will be written. `final` assigns real ids to new items.
  function checklistItems(final) {
    const used = new Set(cl.rows.map((r) => r.id).filter(Boolean));
    const items = [];
    const invalid = [];
    for (const r of cl.rows) {
      if (r.deleted) continue;
      const tr = r.tr.trim(), en = r.en.trim();
      if (!tr && !en) {
        if (r.id) invalid.push(r); // a new, still empty item is simply left out
        continue;
      }
      const o = { id: r.id || (final ? newId(en || tr, used) : 'new-' + r.key), en: en || tr, tr: tr || en };
      if (r.legacy) o.legacy = r.legacy;
      items.push(o);
    }
    return { items, invalid };
  }
  // Same layout as the file in the repo: one item per line.
  function serializeChecklist(items) {
    return '[\n' + items.map((o) => '  ' + JSON.stringify(o)).join(',\n') + '\n]\n';
  }
  function checklistDirty() {
    return loaded && serializeChecklist(checklistItems(false).items) !== cl.base;
  }

  // ---------- Team model ----------

  const sortNames = (a) => a.slice().sort((x, y) => x.localeCompare(y, 'tr'));
  function setTeam(data, sha) {
    tm.sha = sha;
    const raw = Array.isArray(data) ? data : [].concat(data.design || [], data.development || data.dev || [], data.product || []);
    tm.names = sortNames(raw.filter((n) => typeof n === 'string' && n.trim()).map((n) => n.trim())
      .filter((n, i, a) => a.indexOf(n) === i));
    tm.added = new Set();
    tm.base = serializeTeam(tm.names);
  }
  function serializeTeam(names) {
    return JSON.stringify(names, null, 2) + '\n';
  }
  function teamDirty() {
    return loaded && serializeTeam(tm.names) !== tm.base;
  }

  // ---------- Rendering ----------

  function iconBtn(icon, title, onclick, disabled) {
    const b = document.createElement('button');
    b.className = 'icon-btn';
    b.innerHTML = ICON[icon];
    b.title = title;
    b.disabled = !!disabled;
    b.onclick = onclick;
    return b;
  }

  function renderItems(focusKey) {
    const list = $('items');
    list.innerHTML = '';
    let n = 0;
    cl.rows.forEach((r, i) => {
      const row = document.createElement('div');
      row.className = 'ad-item' + (r.orig ? '' : ' new') + (r.deleted ? ' deleted' : '') + (r.invalid ? ' invalid' : '');

      const num = document.createElement('div');
      num.className = 'num';
      num.textContent = r.deleted ? '–' : ++n;

      const fields = document.createElement('div');
      fields.className = 'fields';
      [['tr', 'TR', t().trPh], ['en', 'EN', t().enPh]].forEach(([k, label, ph]) => {
        const f = document.createElement('label');
        f.className = 'fld';
        const b = document.createElement('b');
        b.textContent = label;
        const input = document.createElement('input');
        input.className = 'input';
        input.value = r[k];
        input.placeholder = ph;
        input.disabled = r.deleted;
        input.oninput = () => {
          r[k] = input.value;
          if (r.invalid && (r.tr.trim() || r.en.trim())) { r.invalid = false; row.classList.remove('invalid'); }
          renderState();
        };
        input.onkeydown = (e) => { if (e.key === 'Enter' && k === 'en' && i === cl.rows.length - 1) addItem(); };
        f.append(b, input);
        fields.append(f);
        if (k === 'tr' && r.key === focusKey) setTimeout(() => input.focus());
      });
      if (!r.orig) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = t().newTag;
        fields.append(tag);
      }

      const acts = document.createElement('div');
      acts.className = 'acts';
      if (r.deleted) {
        const b = document.createElement('button');
        b.className = 'btn small restore';
        b.textContent = t().restore;
        b.onclick = () => { r.deleted = false; renderItems(); renderState(); };
        acts.append(b);
      } else {
        acts.append(
          iconBtn('up', t().up, () => move(i, -1), i === 0),
          iconBtn('down', t().down, () => move(i, 1), i === cl.rows.length - 1),
          iconBtn('del', t().del, () => {
            // A new item just goes away; an existing one stays, crossed out, until publishing.
            if (r.orig) r.deleted = true; else cl.rows.splice(i, 1);
            r.invalid = false;
            renderItems();
            renderState();
          })
        );
      }
      row.append(num, fields, acts);
      list.append(row);
    });
  }

  function move(i, d) {
    const j = i + d;
    if (j < 0 || j >= cl.rows.length) return;
    const tmp = cl.rows[i]; cl.rows[i] = cl.rows[j]; cl.rows[j] = tmp;
    renderItems();
    renderState();
  }

  function addItem() {
    const r = { id: null, tr: '', en: '', legacy: undefined, orig: null, deleted: false, key: ++keySeq };
    cl.rows.push(r);
    renderItems(r.key);
    renderState();
    const scroll = root.querySelector('#ad-main .scroll');
    setTimeout(() => { scroll.scrollTop = scroll.scrollHeight; });
  }

  function renderNames() {
    $('teamCount').textContent = t().teamCount(tm.names.length);
    const list = $('names');
    list.innerHTML = '';
    tm.names.forEach((name) => {
      const row = document.createElement('div');
      row.className = 'ad-name' + (tm.added.has(name) ? ' new' : '');
      const span = document.createElement('span');
      span.textContent = name;
      const x = document.createElement('button');
      x.className = 'icon-btn danger';
      x.innerHTML = X;
      x.title = t().removeName;
      x.onclick = () => { tm.names = tm.names.filter((n) => n !== name); tm.added.delete(name); renderNames(); renderState(); };
      row.append(span, x);
      list.append(row);
    });
    list.style.display = tm.names.length ? '' : 'none';
  }

  function addName() {
    const input = $('name');
    const name = input.value.trim().replace(/\s+/g, ' ');
    if (!name) return;
    if (tm.names.some((n) => n.toLocaleLowerCase('tr') === name.toLocaleLowerCase('tr'))) {
      msg = { kind: 'err', title: t().dupName, text: '' };
      return renderState();
    }
    tm.names = sortNames(tm.names.concat(name));
    tm.added.add(name);
    input.value = '';
    msg = null;
    renderNames();
    renderState();
    input.focus();
  }

  // Footer, tabs, banner and buttons.
  function renderState() {
    // While the saved token is still being read (undefined), show the loading state, not the connect form.
    root.classList.toggle('connected', token !== null);
    root.classList.toggle('loading', busy === 'load' || (token !== null && !loaded && !msg));
    root.dataset.tab = tab;
    const dirty = { checklist: checklistDirty(), team: teamDirty() };
    root.querySelectorAll('.ad-tabs button').forEach((b) => {
      b.classList.toggle('on', b.dataset.tab === tab);
      b.classList.toggle('dirty', dirty[b.dataset.tab]);
    });

    const banner = $('msg');
    banner.className = 'banner' + (msg ? ' show ' + msg.kind : '');
    $('msgTitle').textContent = msg ? msg.title : '';
    $('msgText').textContent = msg ? msg.text : '';

    $('status').textContent = !loaded ? '' : dirty[tab] ? t().unsaved : t().upToDate;
    $('save').textContent = busy === 'publish' ? t().publishing : t().publish;
    $('save').disabled = !!busy || !loaded || !dirty[tab];
    $('discard').disabled = !!busy;

    $('connectBtn').textContent = busy === 'connect' ? t().connecting : t().connect;
    $('connectBtn').disabled = busy === 'connect';
  }

  function renderAll() {
    renderItems();
    renderNames();
    renderState();
  }

  // ---------- Flow ----------

  async function load() {
    busy = 'load';
    msg = null;
    renderState();
    try {
      const [c, m] = await Promise.all([readFile('checklist'), readFile('team')]);
      setChecklist(c.data, c.sha);
      setTeam(m.data, m.sha);
      loaded = true;
    } catch (e) {
      loaded = false;
      msg = { kind: 'err', title: t().loadFailed, text: String(e && e.message ? e.message : e) + '. ' + t().retry };
    }
    busy = null;
    renderAll();
  }

  async function connect() {
    const value = $('token').value.trim();
    if (!value) return;
    busy = 'connect';
    $('connectErr').classList.remove('show');
    renderState();
    let error = null;
    try {
      const res = await fetch(API, { cache: 'no-store', headers: { Authorization: 'Bearer ' + value, Accept: 'application/vnd.github+json' } });
      if (res.status === 401) error = t().badToken;
      else if (!res.ok) error = t().noRepo;
    } catch (e) {
      error = t().netErr;
    }
    busy = null;
    if (error) {
      $('connectErr').textContent = error;
      $('connectErr').classList.add('show');
      return renderState();
    }
    token = value;
    $('token').value = '';
    send({ type: 'setAdmin', token: value });
    load();
  }

  function disconnect() {
    token = null;
    loaded = false;
    msg = null;
    send({ type: 'setAdmin', token: null });
    renderState();
  }

  function summary() {
    const added = cl.rows.filter((r) => !r.orig && !r.deleted && (r.tr.trim() || r.en.trim())).length;
    const removed = cl.rows.filter((r) => r.orig && r.deleted).length;
    const edited = cl.rows.filter((r) => r.orig && !r.deleted && (r.tr.trim() !== r.orig.tr || r.en.trim() !== r.orig.en)).length;
    const order = (rows) => rows.filter((r) => r.orig && !r.deleted).map((r) => r.id).join('|');
    const before = cl.baseIds.filter((id) => cl.rows.some((r) => r.id === id && !r.deleted)).join('|');
    const lines = [];
    if (added) lines.push(t().sumAdded(added));
    if (removed) lines.push(t().sumRemoved(removed));
    if (edited) lines.push(t().sumEdited(edited));
    if (order(cl.rows) !== before) lines.push(t().sumOrder);
    lines.push(t().sumDelay);
    return lines;
  }

  function startPublish() {
    if (tab === 'team') return publish();
    const { invalid } = checklistItems(false);
    if (invalid.length) {
      invalid.forEach((r) => { r.invalid = true; });
      msg = { kind: 'err', title: t().emptyItem, text: '' };
      renderItems();
      return renderState();
    }
    const ul = $('summary');
    ul.innerHTML = '';
    summary().forEach((line) => {
      const li = document.createElement('li');
      li.textContent = line;
      ul.append(li);
    });
    $('confirm').classList.add('show');
  }

  async function publish() {
    $('confirm').classList.remove('show');
    const name = tab;
    busy = 'publish';
    msg = null;
    renderState();
    let result, text, items = null;
    try {
      if (name === 'checklist') {
        items = checklistItems(true).items;
        text = serializeChecklist(items);
        result = await writeFile('checklist', text, 'Update checklist items (Pyde Design admin)');
      } else {
        text = serializeTeam(tm.names);
        result = await writeFile('team', text, 'Update team list (Pyde Design admin)');
      }
    } catch (e) {
      result = t().netErr;
    }
    busy = null;
    if (result === 'ok') {
      msg = { kind: 'ok', title: t().published, text: t().publishedText };
      if (name === 'checklist') {
        setChecklist(items, cl.sha);
        Checklist.setItems(items);
      } else {
        setTeam(JSON.parse(text), tm.sha);
        ReadMe.setTeam(tm.names);
      }
    } else if (result === 'conflict') {
      msg = { kind: 'err', title: t().conflict, text: t().conflictText };
    } else {
      msg = { kind: 'err', title: t().failed, text: result };
    }
    renderAll();
  }

  // ---------- Public ----------

  function open() {
    document.body.classList.add('admin-open');
    if (token === undefined) send({ type: 'getAdmin' });
    else if (token && !loaded && !busy) load();
    renderState();
  }
  function close() {
    document.body.classList.remove('admin-open');
  }
  function onToken(value) {
    token = value || null;
    if (token && !loaded && !busy) load();
    renderState();
  }
  function applyLang() {
    translate(root, t());
    renderAll();
  }

  // ---------- Events ----------

  root.querySelectorAll('.ad-tabs button').forEach((b) => {
    b.onclick = () => { tab = b.dataset.tab; msg = null; renderState(); };
  });
  $('connectBtn').onclick = connect;
  $('token').onkeydown = (e) => { if (e.key === 'Enter') connect(); };
  $('addItem').onclick = addItem;
  $('addName').onclick = addName;
  $('name').onkeydown = (e) => { if (e.key === 'Enter') addName(); };
  $('save').onclick = startPublish;
  $('discard').onclick = load; // reloads both files from GitHub
  $('cancelPublish').onclick = () => $('confirm').classList.remove('show');
  $('confirmPublish').onclick = publish;
  $('disconnect').onclick = disconnect;

  return { open, close, onToken, applyLang };
})();

// Shows the home screen (null) or a tool, and tells code.js which tool is on screen.
function go(f) {
  const next = MODULES[f] ? f : 'home';
  if (screen === 'readme' && next !== 'readme') ReadMe.onLeave();
  screen = next;
  document.body.dataset.screen = next;
  document.body.classList.remove('settings-open', 'admin-open');
  send({ type: 'nav', f: next === 'home' ? null : next });
}

function applyLang() {
  document.documentElement.lang = lang;
  translate(document, g(), true);
  document.querySelectorAll('[data-lang]').forEach((b) => b.classList.toggle('on', b.dataset.lang === lang));
  $('sVer').textContent = g().version + ' ' + VERSION + (remoteVersion ? '  ·  GitHub: v' + remoteVersion : '');
  if (latestVersion) $('versions').textContent = g().installed + ': v' + VERSION + '  ·  ' + g().latest + ': v' + latestVersion;
  Object.keys(MODULES).forEach((k) => MODULES[k].applyLang());
  Admin.applyLang();
}

// Returns true if version a is older than b (e.g. '1.0.0' < '1.1.0').
function isOlder(a, b) {
  const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
  for (let i = 0; i < 3; i++) {
    const x = pa[i] || 0, y = pb[i] || 0;
    if (x !== y) return x < y;
  }
  return false;
}

// The version check is mandatory and covers every tool: the plugin stays behind a gate until it succeeds.
// If the check can't complete (offline, GitHub unreachable, bad response) the gate stays up with a retry button.
// A silent re-check (periodic, while the plugin stays open) only blocks when it positively finds a newer
// version; a failed silent check is ignored so a brief network blip doesn't interrupt someone mid-work.
async function checkVersion(silent) {
  const cl = document.body.classList;
  if (!silent) {
    cl.remove('check-failed', 'outdated');
    cl.add('checking');
  }
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    const res = await fetch(VERSION_URL + '?t=' + Date.now(), { signal: ctrl.signal, cache: 'no-store' });
    clearTimeout(timer);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const latest = (await res.json()).version;
    if (typeof latest !== 'string' || !/^\d+\.\d+\.\d+$/.test(latest)) throw new Error('Bad version');
    remoteVersion = latest;
    console.log('[Pyde Design] installed v' + VERSION + ', GitHub v' + latest);
    if (isOlder(VERSION, latest)) {
      latestVersion = latest;
      cl.add('outdated');
    }
    applyLang();
    cl.remove('checking');
  } catch (e) {
    if (!silent) {
      cl.remove('checking');
      cl.add('check-failed');
    }
  }
}
$('retry').onclick = () => checkVersion();
setInterval(() => checkVersion(true), 5 * 60 * 1000);
