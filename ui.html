<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The whole plugin uses DM Sans; if it can't load, Inter / the system font is used. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
  /* The brand color is only used in the top bar and on primary action buttons.
     Everything else follows Figma's neutral theme colors (light and dark). */
  :root {
    --brand: #4261EE;
    --bar-h: 52px;
    --focus: var(--figma-color-border-strong);
    --raised: 0 0 0 1px var(--figma-color-border), 0 1px 2px rgba(0, 0, 0, .1);
    --wip: #F59E0B;
    --review: #7C5CFF;
    --ready: #1BC47D;
    --green: #1bc47d;
    --green-soft: rgba(27, 196, 125, .14);
    --ok: #16A34A;
    --ok-bg: rgba(22, 163, 74, .12);
    --warn: #B45309;
    --warn-bg: rgba(245, 158, 11, .14);
    --danger: #E5484D;
    --sticky: #FFEFA6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    font: 12px/1.45 'DM Sans', Inter, system-ui, sans-serif;
    color: var(--figma-color-text); background: var(--figma-color-bg);
    -webkit-font-smoothing: antialiased;
  }
  body.loading { visibility: hidden; } /* avoids a language flash before saved prefs arrive */
  button, input, textarea { font: inherit; color: inherit; }

  /* ---------- Top bar (brand color) ---------- */
  .bar {
    flex: none; height: var(--bar-h); display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 0 10px 0 12px; background: var(--brand); color: #fff;
  }
  .brand {
    display: flex; align-items: center; gap: 9px; min-width: 0; padding: 4px 8px 4px 4px; margin-left: -4px;
    border: 0; border-radius: 8px; background: none; cursor: pointer; text-align: left;
  }
  .brand:hover { background: rgba(255, 255, 255, .12); }
  .logo { flex: none; width: 30px; height: 30px; border-radius: 4px; }
  .brand b { display: block; font-size: 13px; line-height: 1.2; letter-spacing: -.01em; }
  .brand small { display: block; font-size: 10px; line-height: 1.2; opacity: .75; font-variant-numeric: tabular-nums; }
  .bar .icon-btn { color: rgba(255, 255, 255, .85); }
  .bar .icon-btn:hover { background: rgba(255, 255, 255, .14); color: #fff; }
  body.checking #openSettings, body.check-failed #openSettings, body.outdated #openSettings { visibility: hidden; }
  body.checking .admin, body.check-failed .admin, body.outdated .admin { display: none !important; }

  /* ---------- Common controls ---------- */
  .icon-btn {
    flex: none; width: 24px; height: 24px; display: grid; place-items: center; padding: 0;
    border: 0; border-radius: 7px; cursor: pointer; background: transparent;
    color: var(--figma-color-text-secondary); transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: var(--figma-color-bg-hover); color: var(--figma-color-text); }
  .icon-btn svg { width: 16px; height: 16px; }
  .icon-btn.danger:hover { color: var(--danger); }

  .btn {
    padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 600;
    border: 1px solid var(--figma-color-border); background: var(--figma-color-bg); transition: background .15s, filter .15s;
  }
  .btn:hover { background: var(--figma-color-bg-hover); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.primary:disabled { filter: none; }
  .btn.ghost-danger { border-color: transparent; background: none; color: var(--danger); font-weight: 500; }
  .btn.ghost-danger:hover { background: rgba(229, 72, 77, .1); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.small { padding: 4px 9px; font-size: 11px; }
  .btn.block { display: block; width: 100%; margin-top: 16px; }

  .seg {
    display: flex; padding: 3px; gap: 3px; border-radius: 10px;
    background: var(--figma-color-bg-secondary); border: 1px solid var(--figma-color-border);
  }
  .seg button {
    flex: 1; min-width: 0; font-weight: 500; padding: 7px 4px; border: 0; border-radius: 7px; cursor: pointer;
    background: transparent; color: var(--figma-color-text-secondary); transition: all .15s;
  }
  .seg button:not(.on):not(:disabled):hover { color: var(--figma-color-text); background: var(--figma-color-bg-hover); }
  .seg button.on { background: var(--figma-color-bg); color: var(--figma-color-text); font-weight: 600; box-shadow: var(--raised); }
  .seg button:disabled { opacity: .4; cursor: default; }

  .input, textarea {
    width: 100%; border-radius: 8px; border: 1px solid var(--figma-color-border);
    background: var(--figma-color-bg); outline: none; transition: border-color .15s;
  }
  .input { padding: 7px 9px; }
  .input:focus, textarea:focus { border-color: var(--focus); }

  .field { margin-top: 16px; }
  .lbl { font-size: 11px; font-weight: 600; color: var(--figma-color-text-secondary); margin-bottom: 6px; }
  .hint { font-size: 11px; color: var(--figma-color-text-tertiary); margin-top: 6px; }

  .tabs { display: flex; gap: 16px; margin-top: 4px; }
  .tabs button {
    padding: 8px 0; border: 0; background: none; cursor: pointer; font-weight: 600;
    color: var(--figma-color-text-secondary); border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tabs button:hover { color: var(--figma-color-text); }
  .tabs button.on { color: var(--figma-color-text); border-bottom-color: var(--figma-color-text); }

  /* Selected target card */
  .target {
    display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 10px;
    background: var(--figma-color-bg-secondary); border: 1px solid var(--figma-color-border);
  }
  .target .ico {
    flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    background: var(--figma-color-bg); color: var(--figma-color-text-secondary); box-shadow: var(--raised);
  }
  .target .ico svg { width: 16px; height: 16px; }
  .target .meta { min-width: 0; flex: 1; }
  .target .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .target .sub { color: var(--figma-color-text-secondary); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    flex: none; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    background: var(--figma-color-bg); border: 1px solid var(--figma-color-border); color: var(--figma-color-text-secondary);
  }

  .banner {
    display: none; margin-top: 10px; padding: 10px 12px; border-radius: 10px;
    background: var(--warn-bg); color: var(--warn);
  }
  .banner.show { display: block; }
  .banner b { display: block; margin-bottom: 2px; }
  .banner .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .banner.info { background: var(--figma-color-bg-secondary); color: var(--figma-color-text); border: 1px solid var(--figma-color-border); }
  .banner.ok { background: var(--ok-bg); color: var(--figma-color-text); }
  .banner.ok b { color: var(--ok); }
  .banner.err { background: rgba(229, 72, 77, .1); color: var(--danger); }

  .add {
    border: 1px dashed var(--figma-color-border); background: none; border-radius: 8px; cursor: pointer;
    padding: 6px 10px; color: var(--figma-color-text-secondary); font-weight: 500; width: 100%; text-align: left;
  }
  .add:hover { color: var(--figma-color-text); background: var(--figma-color-bg-hover); }

  .placeholder {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 60px 24px; text-align: center;
  }
  .placeholder .big, .gate .big, .update .big {
    width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 6px;
    background: var(--figma-color-bg-secondary); color: var(--figma-color-text-secondary);
  }
  .placeholder .big svg { width: 24px; height: 24px; }
  .placeholder b { font-size: 13px; }
  .placeholder span { color: var(--figma-color-text-secondary); }

  /* Overview lists */
  .page-name {
    margin: 16px 0 6px; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--figma-color-text-tertiary);
  }
  .page-name small { text-transform: none; letter-spacing: 0; font-weight: 500; }
  .entry {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; margin-bottom: 4px;
    border-radius: 9px; border: 1px solid var(--figma-color-border); background: var(--figma-color-bg);
    cursor: pointer; text-align: left;
  }
  .entry:hover { background: var(--figma-color-bg-hover); }
  .entry .meta { flex: 1; min-width: 0; }
  .entry .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry .sub { font-size: 11px; color: var(--figma-color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ov-empty { padding: 40px 12px; text-align: center; color: var(--figma-color-text-secondary); }
  .ov-foot { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .emoji { flex: none; font-size: 12px; line-height: 1; }

  /* Confirm dialog */
  .confirm {
    position: fixed; inset: 0; z-index: 8; display: none; align-items: center; justify-content: center;
    padding: 24px; background: rgba(0, 0, 0, .35);
  }
  .confirm.show { display: flex; }
  .confirm .box {
    background: var(--figma-color-bg); border-radius: 12px; padding: 16px; max-width: 280px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
  }
  .confirm h3 { margin: 0 0 4px; font-size: 13px; }
  .confirm p { margin: 0; color: var(--figma-color-text-secondary); }
  .confirm .actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 14px; }

  /* ---------- Screens ---------- */
  .screen { flex: 1; min-height: 0; display: none; flex-direction: column; }
  body[data-screen="home"] #s-home,
  body[data-screen="checklist"] #s-checklist,
  body[data-screen="readme"] #s-readme,
  body[data-screen="note"] #s-note,
  body[data-screen="images"] #s-images,
  body[data-screen="titles"] #s-titles { display: flex; }

  .f-head { flex: none; padding: 10px 16px 0 10px; border-bottom: 1px solid var(--figma-color-border); }
  .f-title { display: flex; align-items: center; gap: 6px; min-height: 28px; padding-bottom: 10px; }
  .f-head .tabs { padding-left: 6px; }
  .f-title h1 { flex: 1; min-width: 0; margin: 0; font-size: 14px; line-height: 1.25; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f-head:has(.tabs) .f-title { padding-bottom: 2px; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 16px; }
  .f-foot {
    flex: none; display: none; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 16px; border-top: 1px solid var(--figma-color-border);
  }
  .info { min-width: 0; color: var(--figma-color-text-secondary); font-size: 11px; }
  .info div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot-actions { flex: none; display: flex; gap: 4px; }

  /* ---------- Home ---------- */
  .home-lbl {
    margin: 2px 2px 8px; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--figma-color-text-tertiary);
  }
  .tool {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; margin-bottom: 8px;
    border-radius: 12px; border: 1px solid var(--figma-color-border); background: var(--figma-color-bg);
    cursor: pointer; text-align: left; transition: background .15s, border-color .15s;
  }
  .tool:hover { background: var(--figma-color-bg-hover); border-color: var(--figma-color-border-strong); }
  .tool .t-ico {
    flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
    background: var(--figma-color-bg-secondary); color: var(--figma-color-text);
  }
  .tool .t-ico svg { width: 18px; height: 18px; }
  .tool .t-meta { flex: 1; min-width: 0; }
  .tool .t-meta b { display: block; font-size: 13px; letter-spacing: -.01em; }
  .tool .t-meta span { display: block; color: var(--figma-color-text-secondary); font-size: 11px; }
  .tool .chev { flex: none; width: 14px; height: 14px; color: var(--figma-color-text-tertiary); }
  .home-foot { margin-top: 14px; padding: 0 2px; font-size: 11px; color: var(--figma-color-text-tertiary); }

  /* ---------- Handoff Pre Checklist ---------- */
  #s-checklist .ck-top { flex: none; padding: 14px 16px 4px; }
  #s-checklist .status {
    flex: none; display: flex; align-items: center; gap: 5px; height: 24px;
    padding: 0 10px 0 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
    background: var(--figma-color-bg-secondary); color: var(--figma-color-text-secondary);
    transition: background .25s, color .25s;
  }
  #s-checklist .status svg { width: 14px; height: 14px; display: none; }
  #s-checklist.all-done .status { background: var(--green); color: #fff; box-shadow: 0 2px 10px rgba(27,196,125,.4); }
  #s-checklist.all-done .status svg { display: block; animation: pop .35s ease-out; }
  #s-checklist.empty .status { display: none; }
  @keyframes pop { 0% { transform: scale(.3); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }

  #s-checklist .progress { height: 6px; margin-top: 12px; border-radius: 999px; background: var(--figma-color-bg-secondary); overflow: hidden; }
  #s-checklist .progress i {
    display: block; height: 100%; width: 0; border-radius: inherit;
    background: var(--figma-color-text-secondary); transition: width .3s ease, background .25s;
  }
  #s-checklist.all-done .progress i { background: var(--green); }
  #s-checklist.empty .ck-top { display: none; }

  #s-checklist ul { flex: 1; min-height: 0; overflow-y: auto; list-style: none; margin: 0; padding: 8px 12px 12px; }
  #s-checklist.empty ul { display: none; }
  #s-checklist li { margin-bottom: 6px; }
  #s-checklist label {
    display: flex; align-items: flex-start; gap: 10px; cursor: pointer;
    padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--figma-color-border);
    background: var(--figma-color-bg);
    transition: border-color .15s, background .15s, transform .1s;
  }
  #s-checklist label:hover { background: var(--figma-color-bg-hover); border-color: var(--figma-color-border-strong); }
  #s-checklist label:active { transform: scale(.995); }
  #s-checklist label input { position: absolute; opacity: 0; pointer-events: none; }
  #s-checklist .box {
    flex: none; width: 18px; height: 18px; margin-top: 1px; border-radius: 6px;
    border: 1.5px solid var(--figma-color-border-strong);
    display: grid; place-items: center; transition: all .15s;
  }
  #s-checklist .box svg { width: 12px; height: 12px; stroke: #fff; opacity: 0; transform: scale(.5); transition: all .15s; }
  #s-checklist .text { flex: 1; transition: color .15s; }
  #s-checklist li.done label { background: var(--green-soft); border-color: transparent; }
  #s-checklist li.done .box { background: var(--green); border-color: var(--green); }
  #s-checklist li.done .box svg { opacity: 1; transform: scale(1); }
  #s-checklist li.done .text { color: var(--figma-color-text-secondary); }
  #s-checklist label input:focus-visible + .box { outline: 2px solid var(--focus); outline-offset: 2px; }

  #s-checklist .placeholder { flex: 1; min-height: 0; padding: 0 32px 32px; }
  #s-checklist.empty .placeholder { display: flex; }
  #s-checklist .f-foot { display: flex; }
  #s-checklist.empty .f-foot { display: none; }
  #s-checklist .info .count { font-variant-numeric: tabular-nums; color: var(--figma-color-text); font-weight: 500; }

  /* ---------- Design ReadMe ---------- */
  #s-readme .view { display: none; }
  #s-readme.view-spec #rm-spec, #s-readme.view-overview #rm-overview { display: block; }
  #s-readme.no-target .placeholder { display: flex; }
  #s-readme.no-target #rm-form { display: none; }
  #s-readme.view-spec.has-target .f-foot { display: flex; }

  #rm-statusSeg button {
    color: var(--figma-color-text); display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
  }
  #rm-statusSeg button.on { color: #fff; box-shadow: none; }
  #rm-statusSeg button[data-status="wip"].on { background: var(--wip); }
  #rm-statusSeg button[data-status="review"].on { background: var(--review); }
  #rm-statusSeg button[data-status="ready"].on { background: var(--ready); }

  #s-readme textarea { padding: 8px 9px; min-height: 120px; resize: vertical; line-height: 1.5; }

  #s-readme .owner { display: grid; grid-template-columns: 82px 1fr; align-items: start; gap: 8px; margin-bottom: 6px; }
  #s-readme .owner > span { padding-top: 7px; color: var(--figma-color-text-secondary); }
  #s-readme .chips {
    width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 4px; min-height: 32px; cursor: text;
    border-radius: 8px; border: 1px solid var(--figma-color-border); background: var(--figma-color-bg); transition: border-color .15s;
  }
  #s-readme .chips:focus-within { border-color: var(--focus); }
  #s-readme .chip {
    display: inline-flex; align-items: center; gap: 2px; height: 22px; padding: 0 3px 0 8px; border-radius: 6px;
    background: var(--figma-color-bg-secondary); box-shadow: inset 0 0 0 1px var(--figma-color-border); font-weight: 500; line-height: 1;
  }
  #s-readme .chip span { display: block; line-height: 16px; white-space: nowrap; }
  #s-readme .chip button {
    flex: none; width: 16px; height: 16px; padding: 0; border: 0; border-radius: 4px; cursor: pointer; background: none;
    color: var(--figma-color-text-secondary); display: grid; place-items: center;
  }
  #s-readme .chip button svg { display: block; }
  #s-readme .chip button:hover { background: var(--figma-color-bg-hover); color: var(--figma-color-text); }
  #s-readme .chips input { flex: 1; min-width: 80px; height: 22px; border: 0; outline: none; background: none; padding: 0 4px; }

  .suggest {
    position: fixed; z-index: 4; display: none; max-height: 240px; overflow-y: auto; padding: 4px;
    border-radius: 9px; border: 1px solid var(--figma-color-border); background: var(--figma-color-bg);
    box-shadow: 0 6px 24px rgba(0, 0, 0, .14);
  }
  .suggest.show { display: block; }
  .sg-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    height: 28px; padding: 0 4px 0 8px; border-radius: 6px; cursor: pointer;
  }
  .sg-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sg-item:hover, .sg-item.on { background: var(--figma-color-bg-hover); }
  .sg-item button {
    flex: none; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 5px; cursor: pointer;
    background: none; color: var(--figma-color-text-tertiary); display: grid; place-items: center;
  }
  .sg-item button:hover { background: var(--figma-color-bg-secondary); color: var(--danger); }
  #s-readme .link-row { display: flex; gap: 4px; margin-bottom: 6px; }
  #s-readme .link-row .input { flex: 1; }

  #s-readme .counts { display: flex; gap: 6px; flex-wrap: wrap; }
  #s-readme .counts button {
    display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--figma-color-border); background: var(--figma-color-bg); font-weight: 500;
  }
  #s-readme .counts button b { font-variant-numeric: tabular-nums; }
  #s-readme .counts button:hover { background: var(--figma-color-bg-hover); }
  #s-readme .counts button.on { border-color: var(--figma-color-border-strong); background: var(--figma-color-bg-secondary); font-weight: 600; }

  /* ---------- Frame Note ---------- */
  #s-note .view { display: none; }
  #s-note.view-note #nt-note, #s-note.view-overview #nt-overview { display: block; }
  #s-note.view-note.has-target .f-foot, #s-note.view-note.multi-target .f-foot { display: flex; }
  #nt-form, #nt-multi, #nt-fix { display: none; }
  #s-note.fixing #nt-fix { display: block; }
  #s-note.fixing #nt-form, #s-note.fixing #nt-multi, #s-note.fixing .placeholder { display: none !important; }
  #s-note.view-note.fixing .f-foot { display: flex; }
  #s-note .ph-actions { display: none; gap: 6px; margin-top: 10px; }
  #s-note .placeholder.orphan .ph-actions { display: flex; }
  #s-note .placeholder .ph-actions .btn { display: block; margin: 0; }
  #s-note .fix-ico { background: rgba(229, 72, 77, .12) !important; color: var(--danger) !important; box-shadow: none !important; }
  #s-note .fix-to { margin-top: 6px; align-items: flex-start; }
  #s-note .fix-to .sub { white-space: normal; }
  #s-note .fix-to.empty { padding: 14px 12px; border-radius: 10px; border: 1px dashed var(--figma-color-border-strong); color: var(--figma-color-text-secondary); text-align: center; }
  #s-note .entry.orphan .meta { cursor: pointer; }
  #s-note .entry.orphan .meta:hover .name { text-decoration: underline; }
  #nt-cancelFix { display: none; }
  #s-note.fixing #nt-cancelFix { display: block; }
  #s-note.has-target #nt-form, #s-note.multi-target #nt-multi { display: block; }
  #s-note.no-target .placeholder { display: flex; }
  #s-note .placeholder.warn .big { background: var(--warn-bg); color: var(--warn); }
  #s-note .placeholder .btn { margin-top: 10px; display: none; }
  #s-note .placeholder.orphan .btn { display: block; }

  #s-note textarea {
    display: block; padding: 8px 9px; min-height: 72px; resize: none; overflow: hidden; line-height: 1.5;

  .gate, .update {

  const ICONS = {
    Frame: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M5.5 2v12M10.5 2v12M2 5.5h12M2 10.5h12"/></svg>',

  };
  const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';

  const t = () => S[lang];
  let targetId = null;
  let lastState = { status: 'none' };
  let items = BUILT_IN;
  let fromGithub = false;
  let pinnedUntil = 0; // after an admin save, the raw GitHub copy can be a few minutes old: keep the saved list

  function build() {
    $('list').innerHTML = '';
    items.forEach((item) => {
      const li = document.createElement('li');
      li.innerHTML = '<label><input type="checkbox"><span class="box">' + CHECK + '</span><span class="text"></span></label>';
      li.querySelector('input').onchange = (e) => {
        const value = e.target.checked;
        li.classList.toggle('done', value); // instant feedback; real state arrives right after
        send({ f: 'checklist', type: 'toggle', id: targetId, item: item.id, legacy: item.legacy, value });
      };
      li._item = item;
      $('list').append(li);
    });
  }

  function showEmpty(title, text) {
    targetId = null;
    root.classList.add('empty');
    root.classList.remove('all-done');
    $('phIco').innerHTML = POINTER;
    $('phTitle').textContent = title;
    $('phText').textContent = text;
  }

  function render(m) {
    lastState = m;
    if (m.status === 'none') return showEmpty(t().emptyTitle, t().emptyText);
    if (m.status === 'multiple') return showEmpty(t().multiTitle, t().multiText(m.count));

    root.classList.remove('empty');
    targetId = m.target.id;
    $('targetIco').innerHTML = ICONS[m.target.kind];
    $('targetName').textContent = m.target.name;
    $('targetSub').textContent = m.target.kind + ' · ' + (m.target.section ? t().inSection(m.target.section) : m.target.page);

    const done = new Set(m.done);
    let n = 0;
    root.querySelectorAll('li').forEach((li) => {
      const on = done.has(li._item.id) || done.has(li._item.legacy);
      li.classList.toggle('done', on);
      li.querySelector('input').checked = on;
      if (on) n++;
    });
    const total = items.length;
    $('bar').style.width = (n / total) * 100 + '%';
    $('count').textContent = t().items(n, total);
    $('upd').textContent = m.at ? t().lastUpdated + (m.by ? m.by + ' · ' : '') + ago(m.at) : t().nothingChecked;
    $('statusText').textContent = n === total ? t().completed : n + '/' + total;
    root.classList.toggle('all-done', n === total);
  }

  function applyLang() {
    translate(root, t());
    root.querySelectorAll('li').forEach((li) => { li.querySelector('.text').textContent = li._item[lang]; });
    document.getElementById('sChecklist').textContent = fromGithub ? t().fromGithub(items.length) : t().fromBuiltIn;
    render(lastState);
  }

  // checklist.json is a list of { id, en, tr, legacy? }. Items without an id or text are skipped,
  // a missing Turkish text falls back to English, and a repeated id is only used once.
  function parseItems(j) {
    if (!Array.isArray(j)) return null;
    const seen = new Set();
    const out = [];
    for (const i of j) {
      if (!i || typeof i.id !== 'string' || !i.id.trim() || seen.has(i.id) || typeof i.en !== 'string' || !i.en.trim()) continue;
      seen.add(i.id);
      out.push({
        id: i.id,
        en: i.en.trim(),
        tr: typeof i.tr === 'string' && i.tr.trim() ? i.tr.trim() : i.en.trim(),
        legacy: typeof i.legacy === 'string' ? i.legacy : undefined
      });
    }
    return out.length ? out : null;
  }

  async function loadItems() {
    if (Date.now() < pinnedUntil) return;
    try {
      const res = await fetch(CHECKLIST_URL + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const next = parseItems(await res.json());
      if (!next) throw new Error('No valid items');
      const changed = !fromGithub || JSON.stringify(next) !== JSON.stringify(items);
      fromGithub = true;
      if (changed) {
        items = next;
        build();
      }
    } catch (e) {
      console.warn('[Pyde Design] checklist.json not loaded, using ' + (fromGithub ? 'the last loaded list' : 'the built-in list'), e);
    }
    applyLang();
  }

  function onMessage(m) {
    if (m.type === 'state') render(m);
  }

  // Called by the admin screen right after it published a new checklist.json.
  function setItems(list) {
    const next = parseItems(list);
    if (!next) return;
    items = next;
    fromGithub = true;
    pinnedUntil = Date.now() + 10 * 60 * 1000;
    build();
    applyLang();
  }

  $('reset').onclick = () => { if (targetId) send({ f: 'checklist', type: 'reset', id: targetId }); };
  build();
  loadItems();
  setInterval(loadItems, 5 * 60 * 1000);

  // Light sync so changes made by other designers show up.
  setInterval(() => { if (screen === 'checklist') send({ f: 'checklist', type: 'refresh' }); }, 3000);

  return { applyLang, onMessage, setItems };
})();

  let form = null;

  let dirty = false;
  let saving = false;

  // ---------- People suggestions ----------
  // Figma only tells plugins who has the file open right now, so the team roster lives in
  // team.json in the GitHub repo. It is merged with the people the plugin finds in the file.
  const TEAM_URL = RAW + 'team.json';
  let team = [];       // names from team.json
  let filePeople = []; // [{ name, removable }] from code.js

  // team.json is a plain list of names: ["Name Surname", …]. The older per-role object
  // ({ design: [], development: [], product: [] }) is still read, flattened.
  async function loadTeam() {
    try {
      const res = await fetch(TEAM_URL + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) return;
      const j = await res.json();
      const raw = Array.isArray(j) ? j : [].concat(j.design || [], j.development || j.dev || [], j.product || []);
      team = raw.filter((n) => typeof n === 'string' && n.trim()).map((n) => n.trim());
      renderPeople();
    } catch (e) {} // suggestions are a convenience, the tool works without them
  }

  // Every owner field gets the same suggestions; any name can go in any field.
  // Names from team.json can't be removed here (edit the file in the repo instead).
  function suggestions() {
    const names = [];
    team.concat(filePeople.map((p) => p.name)).forEach((n) => { if (names.indexOf(n) === -1) names.push(n); });
    const removable = (n) => team.indexOf(n) === -1 && filePeople.some((p) => p.name === n && p.removable);
    return names.sort((a, b) => a.localeCompare(b, 'tr')).map((name) => ({ name, removable: removable(name) }));
  }

  function renderPeople() {

    suggest.input = null;
    suggest.active = -1;
    $('suggest').classList.remove('show');
  }

  function showSuggest(input, role, box, commit) {
    Object.assign(suggest, { input, role, box, commit });

    suggest.items = suggestions()

    el.style.maxHeight = '';

    el.style.maxHeight = Math.min(240, up ? above : below) + 'px';
    el.style.top = (up ? r.top - el.offsetHeight - 4 : r.bottom + 4) + 'px';

      const input = document.createElement('input');
      const commit = (refocus) => {
        const v = input.value.trim().replace(/,$/, '').trim();
        if (v && form.owners[role].indexOf(v) === -1) { form.owners[role].push(v); markDirty(); }
        input.value = '';

        if (refocus) box.querySelector('input').focus();

      input.onkeydown = (e) => {
        const open = suggest.input === input && suggest.items.length;
        if (open && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
          e.preventDefault();

          suggest.active = e.key === 'ArrowDown' ? (suggest.active + 1) % n : (suggest.active - 1 + n) % n;
          showSuggest(input, role, box, commit);
        } else if (e.key === 'Escape' && open) {

      input.oninput = () => { suggest.active = -1; showSuggest(input, role, box, commit); };

        if (suggest.input === input) hideSuggest();

      input.oninput = () => { form[kind][i] = input.value; markDirty(); };
      const x = document.createElement('button');
      x.className = 'icon-btn';
      x.innerHTML = X;
      x.onclick = () => { form[kind].splice(i, 1); markDirty(); renderLinks(kind); };
      row.append(input, x);
      list.append(row);
    });
  }

  function renderForm() {
    renderStatus();
    renderChips();
    renderLinks('jira');
    renderLinks('slack');
    $('notes').value = form.notes;
  }

  function renderFooter() {
    const s = editing && editing.spec;
    $('save').textContent = editing && editing.hasSpec ? t().save : t().create;
    $('save').disabled = saving || (editing && editing.hasSpec && !dirty);
    $('remove').style.display = editing && editing.hasSpec ? '' : 'none';
    $('upd').textContent = dirty ? t().unsaved
      : s && s.at ? t().lastUpdated + (s.by ? s.by + ' · ' : '') + ago(s.at) : t().notSaved;
  }

  function renderTarget(m) {
    $('targetIco').innerHTML = ICON_SECTION;
    $('targetName').textContent = m.target.name;
    $('targetSub').textContent = 'Section · ' + (m.target.section ? t().inSection(m.target.section) : m.target.page);
    $('badge').textContent = m.spec ? t().statusLong[m.spec.status] : t().noSpec;
  }

  // Fills the form from the plugin state, unless the user is mid-edit.
  function render(m) {
    lastState = m;
    const cl = root.classList;

    if (dirty && editing && !(m.status === 'ok' && m.target.id === editing.id)) {
      // Selection moved away while editing: keep the form bound to the original target.
      $('staleBanner').classList.add('show');
      $('staleText').textContent = t().staleText(editing.name);
      $('goBack').textContent = t().goBack(editing.name);
      return;
    }
    $('staleBanner').classList.remove('show');

    if (m.status !== 'ok') {
      editing = null;
      cl.add('no-target');
      cl.remove('has-target');
      const key = m.status === 'multiple' ? 'multi' : m.status === 'frame' ? 'frame' : 'empty';
      $('phTitle').textContent = t()[key + 'Title'];
      $('phText').textContent = key === 'multi' ? t().multiText(m.count) : t()[key + 'Text'];
      return;
    }

    cl.remove('no-target');
    cl.add('has-target');
    renderTarget(m);

    const sameTarget = editing && editing.id === m.target.id;
    editing = { id: m.target.id, name: m.target.name, hasSpec: !!m.spec, spec: m.spec };
    // Don't redraw a form that is being typed into (it would reset the cursor).
    const typing = sameTarget && document.activeElement && $('form').contains(document.activeElement);
    if (!dirty && !typing) {
      if (m.draft) {
        // The plugin was closed with unsaved edits on this section: bring them back.
        form = formFromDraft(m.draft);
        dirty = true;
        $('draftBanner').classList.add('show');
      } else {
        form = m.spec ? formFromSpec(m.spec) : emptyForm(m.me);
        $('draftBanner').classList.remove('show');
      }
      renderForm();
    }

    renderFooter();
  }

  function collect() {
    return {
      status: form.status,
      owners: form.owners,
      jira: form.jira,
      slack: form.slack,
      notes: $('notes').value
    };
  }

  function save() {
    if (!editing || saving) return;
    saving = true;
    clearTimeout(draftTimer);
    $('draftBanner').classList.remove('show');
    renderFooter();
    send({ f: 'readme', type: 'save', id: editing.id, spec: collect() });
  }

  // ---------- Overview ----------

  function renderOverview() {
    if (!overview) return;
    const entries = overview.entries.slice().sort((a, b) => (b.at || 0) - (a.at || 0));
    const count = (s) => entries.filter((e) => s === 'all' || e.status === s).length;
    $('counts').innerHTML = '';
    ['all', 'wip', 'review', 'ready'].forEach((s) => {
      const b = document.createElement('button');
      b.className = filter === s ? 'on' : '';
      b.innerHTML = (s === 'all' ? '' : '<span class="emoji">' + EMOJI[s] + '</span>') + '<span></span><b></b>';
      b.querySelector('span:not(.emoji)').textContent = s === 'all' ? t().all : t()[s];
      b.querySelector('b').textContent = count(s);
      b.onclick = () => { filter = s; renderOverview(); };
      $('counts').append(b);
    });

    const list = $('ovList');
    list.innerHTML = '';
    const shown = entries.filter((e) => filter === 'all' || e.status === filter);
    if (!shown.length) {
      const d = document.createElement('div');
      d.className = 'ov-empty';
      d.textContent = entries.length ? t().ovEmptyFilter : t().ovEmpty;
      list.append(d);
      return;
    }
    // Current page first, then the rest alphabetically.
    const pages = [];
    shown.forEach((e) => { if (pages.indexOf(e.pageId) === -1) pages.push(e.pageId); });
    const pageName = (id) => (shown.find((e) => e.pageId === id) || {}).pageName || '';
    pages.sort((a, b) => (a === overview.currentPageId ? -1 : b === overview.currentPageId ? 1 : pageName(a).localeCompare(pageName(b))));
    pages.forEach((pid) => {
      const h = document.createElement('div');
      h.className = 'page-name';
      h.textContent = pageName(pid);
      if (pid === overview.currentPageId) {
        const small = document.createElement('small');
        small.textContent = ' · ' + t().current;
        h.append(small);
      }
      list.append(h);
      shown.filter((e) => e.pageId === pid).forEach((e) => {
        const b = document.createElement('button');
        b.className = 'entry';
        b.innerHTML = '<span class="emoji">' + (EMOJI[e.status] || '') + '</span><div class="meta"><div class="name"></div><div class="sub"></div></div>';
        b.querySelector('.name').textContent = e.name;
        b.querySelector('.sub').textContent = t().statusLong[e.status] + (e.at ? ' · ' + (e.by ? e.by + ' · ' : '') + ago(e.at) : '');
        b.onclick = () => { send({ f: 'readme', type: 'goto', id: e.id }); setView('spec'); };
        list.append(b);
      });
    });
  }

  function setView(v) {
    root.classList.toggle('view-spec', v === 'spec');
    root.classList.toggle('view-overview', v === 'overview');
    root.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.view === v));
    if (v === 'overview') send({ f: 'readme', type: 'overview' });
  }

  function applyLang() {
    translate(root, t());
    render(lastState);
    renderFooter();
    renderOverview();
  }

  function onMessage(m) {
    if (m.type === 'state') {
      // While saving, keep the form as it is; the state that follows 'saved' fills it in.
      if (saving) { lastState = m; return; }
      render(m);
    } else if (m.type === 'saved') {
      saving = false;
      dirty = false;
    } else if (m.type === 'people') {
      filePeople = m.people || [];
      renderPeople();
    } else if (m.type === 'overview') {
      overview = m;
      $('scanAll').textContent = t().scanAll;
      $('scanAll').disabled = false;
      renderOverview();
    } else if (m.type === 'error') {
      saving = false;
      $('scanAll').textContent = t().scanAll;
      $('scanAll').disabled = false;
      renderFooter();
    }
  }

  // ---------- Events ----------

  root.querySelectorAll('.tabs button').forEach((b) => { b.onclick = () => setView(b.dataset.view); });
  root.querySelectorAll('#rm-statusSeg button').forEach((b) => {
    b.onclick = () => { form.status = b.dataset.status; markDirty(); renderStatus(); };
  });
  root.querySelectorAll('[data-add]').forEach((b) => {
    b.onclick = () => {
      const kind = b.dataset.add;
      form[kind].push('');
      markDirty();
      renderLinks(kind);
      const inputs = $(kind + 'List').querySelectorAll('input');
      inputs[inputs.length - 1].focus();
    };
  });
  root.querySelector('main').addEventListener('scroll', () => { if (suggest.input) suggest.input.blur(); });
  $('notes').oninput = () => { form.notes = $('notes').value; markDirty(); };
  $('save').onclick = save;
  $('goBack').onclick = () => { if (editing) send({ f: 'readme', type: 'goto', id: editing.id }); };
  $('discard').onclick = () => {
    if (editing) dropDraft(editing.id);
    dirty = false; editing = null; render(lastState); send({ f: 'readme', type: 'refresh' });
  };
  $('dropDraft').onclick = () => {
    if (!editing) return;
    dropDraft(editing.id);
    dirty = false;
    lastState.draft = null;
    editing = null;
    render(lastState);
  };
  $('remove').onclick = () => $('confirm').classList.add('show');
  $('cancelRemove').onclick = () => $('confirm').classList.remove('show');
  $('confirmRemove').onclick = () => {
    $('confirm').classList.remove('show');
    if (editing) { dropDraft(editing.id); dirty = false; send({ f: 'readme', type: 'remove', id: editing.id }); }
  };
  $('scanAll').onclick = () => {
    $('scanAll').textContent = t().scanning;
    $('scanAll').disabled = true;
    send({ f: 'readme', type: 'scanAll' });
  };

  form = emptyForm(null);
  loadTeam();

  // Light sync so changes made by other designers show up.
  setInterval(() => { if (screen === 'readme' && !dirty && !saving) send({ f: 'readme', type: 'refresh' }); }, 3000);

  // Called by the admin screen right after it published a new team.json.
  function setTeam(names) {
    team = names.slice();
    renderPeople();
  }

  $('fit').onclick = () => { if (editing) send({ f: 'readme', type: 'fit', id: editing.id }); };

  return { applyLang, onMessage, save, onLeave: hideSuggest, setTeam };
})();

    if (n) n.entries.forEach((e) => { if (!last || e.at > last.at) last = e; });
    $('upd').textContent = dirty ? t().unsaved
      : last ? t().lastUpdated + last.by + ' · ' + ago(last.at) : t().notSaved;
  }

  function showPlaceholder(key, m) {
    const ph = $('placeholder');
    ph.className = 'placeholder' + (key === 'orphan' ? ' warn orphan' : '');
    $('phIco').innerHTML = key === 'orphan' ? ICONS.Warn : POINTER;
    $('phTitle').textContent = t()[key + 'Title'];
    $('phText').textContent = key === 'orphan' ? t().orphanText(m.orphan.name, m.orphan.reason) : t()[key + 'Text'];
  }

  function setMode(mode) {
    const cl = root.classList;
    cl.toggle('no-target', mode === 'none');
    cl.toggle('has-target', mode === 'single');
    cl.toggle('multi-target', mode === 'multi');
  }

  // ---------- Fixing a broken card ----------
  // `fixing` is the broken card being attached; `fixTarget` the frame it will go to: the frame selected
  // on the canvas, or else the one suggested right above the card.
  let fixing = null;   // { cardId, name, reason, suggestion }
  let fixTarget = null; // { id, name, hasNote }

  function startFix() {
    const o = lastState.orphan;
    if (!o) return;
    fixing = { cardId: o.id, name: o.name, reason: o.reason, suggestion: o.suggestion || null };
    root.classList.add('fixing');
    render(lastState);
  }
  function stopFix() {
    fixing = null;
    fixTarget = null;
    root.classList.remove('fixing');
    render(lastState);
  }

  function renderFix(m) {
    $('fixIco').innerHTML = ICONS.Warn;
    $('fixName').textContent = t().fixFrom(fixing.name);
    $('fixSub').textContent = t().orphanSub(fixing.reason);
    const picked = m.status === 'ok' ? { id: m.target.id, name: m.target.name, hasNote: !!m.note, section: m.target.section, page: m.target.page } : null;
    fixTarget = picked || (m.status === 'multiple' ? null : fixing.suggestion);
    const box = $('fixTo');
    box.classList.toggle('empty', !fixTarget);
    if (fixTarget) {
      $('fixToIco').innerHTML = ICONS.Frame;
      $('fixToName').textContent = fixTarget.name;
      $('fixToSub').textContent = fixTarget.hasNote ? t().fixHasNote(fixTarget.name) : t().fixNew;
      $('fixToIco').style.display = $('fixToSub').style.display = '';
    } else {
      $('fixToIco').style.display = $('fixToSub').style.display = 'none';
      $('fixToName').textContent = m.status === 'multiple' ? t().fixMulti : t().fixPick;
    }
    $('fixHint').textContent = !fixTarget ? '' : picked ? t().fixChosen : t().fixSuggested;
  }

  // Fills the form from the plugin state, unless the user is mid-edit.
  function render(m) {
    lastState = m;

    if (fixing) {
      renderFix(m);
      return renderFooter();
    }

    if (dirty && editing && !(m.status === 'ok' && m.target.id === editing.id)) {
      // Selection moved away while editing: keep the form bound to the original frame.
      $('staleBanner').classList.add('show');
      $('staleText').textContent = t().staleText(editing.name);
      $('goBack').textContent = t().goBack(editing.name);
      return;
    }
    $('staleBanner').classList.remove('show');

    if (m.status === 'multiple') {
      editing = null;
      multi = { ids: m.frames.map((f) => f.id) };
      setMode('multi');
      renderMulti(m);
      return renderFooter();
    }
    multi = null;

    if (m.status !== 'ok') {
      editing = null;
      setMode('none');
      showPlaceholder(m.status === 'orphan' ? 'orphan' : m.status === 'section' ? 'section' : 'empty', m);
      return;
    }

    setMode('single');
    me = m.me || me;
    $('targetIco').innerHTML = ICONS.Frame;
    $('targetName').textContent = m.target.name;
    $('targetSub').textContent = 'Frame · ' + (m.target.section ? t().inSection(m.target.section) : m.target.page);
    $('noSectionBanner').classList.toggle('show', !m.target.section);
    $('badge').textContent = m.note ? t().count(m.note.entries.length) : t().noNote;
    $('overlapBanner').classList.toggle('show', !!(m.overlaps && m.overlaps.length));
    if (m.overlaps && m.overlaps.length) $('overlapText').textContent = t().overlapText(m.overlaps);

    const sameTarget = editing && editing.id === m.target.id;
    editing = { id: m.target.id, name: m.target.name, hasNote: !!m.note, note: m.note };
    // Don't redraw a form that is being typed into (it would reset the cursor).
    const typing = sameTarget && document.activeElement && $('form').contains(document.activeElement);
    if (!dirty && !typing) {
      const paras = m.draft && Array.isArray(m.draft.paras) ? m.draft.paras.filter((p) => p && typeof p.text === 'string') : null;
      if (paras && paras.length) {
        // The plugin was closed with unsaved edits on this frame: bring them back.
        form = { paras: paras.map((p) => ({ id: p.id || null, text: p.text, by: p.by || null, at: p.at || null })) };
        dirty = true;
        $('draftBanner').classList.add('show');
      } else {
        form = formFromNote(m.note);
        $('draftBanner').classList.remove('show');
      }
      renderParas();
    }
    renderFooter();
  }

  // ---------- Multiple frames ----------

  function renderMulti(m) {
    if (!$('bulk').value && m.draft && typeof m.draft.text === 'string') {
      $('bulk').value = m.draft.text;
      grow($('bulk'));
    }
    $('multiIco').innerHTML = ICONS.Frames;
    $('multiName').textContent = t().multiName(m.frames.length);
    const outside = m.frames.filter((f) => !f.section).length;
    $('outsideBanner').classList.toggle('show', outside > 0);
    $('outsideText').textContent = t().outsideMulti(outside);
    const list = $('frameList');
    list.innerHTML = '';
    m.frames.forEach((f) => {
      const row = document.createElement('div');
      row.className = 'frame-row';
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = f.name;
      const count = document.createElement('span');
      count.className = 'count';
      count.textContent = f.count ? t().count(f.count) : t().noNote;
      row.append(name, count);
      list.append(row);
    });
  }

  // ---------- Saving ----------

  function save() {
    if (saving || $('save').disabled) return;
    if (fixing) {
      if (!fixTarget) return;
      saving = true;
      renderFooter();
      return send({ f: 'note', type: 'fix', id: fixing.cardId, frameId: fixTarget.id });
    }
    clearTimeout(draftTimer);
    $('draftBanner').classList.remove('show');
    if (multi) {
      saving = true;
      renderFooter();
      return send({ f: 'note', type: 'addToAll', ids: multi.ids, text: $('bulk').value });
    }
    if (!editing) return;
    saving = true;
    renderFooter();
    send({ f: 'note', type: 'save', id: editing.id, entries: form.paras.map((p) => ({ id: p.id, text: p.text })) });
  }

  // ---------- Overview ----------

  function renderOverview() {
    if (!overview) return;
    const entries = overview.entries.slice().sort((a, b) => (b.at || 0) - (a.at || 0));
    const total = entries.reduce((n, e) => n + (e.count || 0), 0);
    $('counts').innerHTML = t().ovCounts(entries.length, total);

    const list = $('ovList');
    list.innerHTML = '';
    if (!entries.length && !overview.orphans.length) {
      const d = document.createElement('div');
      d.className = 'ov-empty';
      d.textContent = t().ovEmpty;
      list.append(d);
      return;
    }

    if (overview.orphans.length) {
      const h = document.createElement('div');
      h.className = 'page-name';
      h.textContent = t().orphans;
      list.append(h);
      overview.orphans.forEach((o) => {
        const row = document.createElement('div');
        row.className = 'entry orphan';
        row.innerHTML = '<span class="dot"></span><div class="meta"><div class="name"></div><div class="sub"></div></div>';
        row.querySelector('.name').textContent = o.name;
        row.querySelector('.sub').textContent = t().orphanSub(o.reason);
        // Clicking it selects the card, where it can be fixed.
        row.querySelector('.meta').onclick = () => { send({ f: 'note', type: 'goto', id: o.id }); setView('note'); };
        const del = document.createElement('button');
        del.className = 'btn small';
        del.textContent = t().deleteNote;
        del.onclick = () => send({ f: 'note', type: 'deleteOrphan', id: o.id });
        row.append(del);
        list.append(row);
      });
    }

    // Current page first, then the rest alphabetically.
    const pages = [];
    entries.forEach((e) => { if (pages.indexOf(e.pageId) === -1) pages.push(e.pageId); });
    const pageName = (id) => (entries.find((e) => e.pageId === id) || {}).pageName || '';
    pages.sort((a, b) => (a === overview.currentPageId ? -1 : b === overview.currentPageId ? 1 : pageName(a).localeCompare(pageName(b))));
    pages.forEach((pid) => {
      const h = document.createElement('div');
      h.className = 'page-name';
      h.textContent = pageName(pid);
      if (pid === overview.currentPageId) {
        const small = document.createElement('small');
        small.textContent = ' · ' + t().current;
        h.append(small);
      }
      list.append(h);
      entries.filter((e) => e.pageId === pid).forEach((e) => {
        const b = document.createElement('button');
        b.className = 'entry';
        b.innerHTML = '<span class="dot"></span><div class="meta"><div class="name"></div><div class="sub"></div><div class="preview"></div></div>';
        b.querySelector('.name').textContent = e.name;
        b.querySelector('.sub').textContent = (e.section ? e.section + ' · ' : '') + t().count(e.count) +
          (e.at ? ' · ' + e.by + ' · ' + ago(e.at) : '');
        b.querySelector('.preview').textContent = e.preview || '';
        b.onclick = () => { send({ f: 'note', type: 'goto', id: e.id }); setView('note'); };
        list.append(b);
      });
    });
  }

  function setView(v) {
    root.classList.toggle('view-note', v === 'note');
    root.classList.toggle('view-overview', v === 'overview');
    root.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.view === v));
    if (v === 'overview') send({ f: 'note', type: 'overview' });
  }

  function applyLang() {
    translate(root, t());
    render(lastState);
    if (form && root.classList.contains('has-target')) renderParas();
    renderFooter();
    renderOverview();
  }

  function onMessage(m) {
    if (m.type === 'state') {
      // While saving, keep the form as it is; the state that follows 'saved' fills it in.
      if (saving) { lastState = m; return; }
      render(m);
    } else if (m.type === 'saved') {
      saving = false;
      dirty = false;
      if (multi) { $('bulk').value = ''; grow($('bulk')); }
      editing = null; // so the saved note is redrawn from the file
    } else if (m.type === 'fixed') {
      saving = false;
      dirty = false;
      editing = null;
      fixing = null;
      fixTarget = null;
      root.classList.remove('fixing');
    } else if (m.type === 'overview') {
      overview = m;
      $('scanAll').textContent = t().scanAll;
      $('scanAll').disabled = false;
      renderOverview();
    } else if (m.type === 'error') {
      saving = false;
      $('scanAll').textContent = t().scanAll;
      $('scanAll').disabled = false;
      renderFooter();
    }
  }

  // ---------- Events ----------

  root.querySelectorAll('.tabs button').forEach((b) => { b.onclick = () => setView(b.dataset.view); });
  $('addPara').onclick = () => {
    form.paras.push({ id: null, text: '', by: null, at: null });
    markDirty();
    renderParas(form.paras.length - 1);
  };
  $('bulk').oninput = () => { grow($('bulk')); renderFooter(); scheduleDraft(); };
  $('save').onclick = save;
  $('goBack').onclick = () => { if (editing) send({ f: 'note', type: 'goto', id: editing.id }); };
  $('discard').onclick = () => {
    if (editing) dropDraft(editing.id);
    dirty = false; editing = null; render(lastState); send({ f: 'note', type: 'refresh' });
  };
  $('dropDraft').onclick = () => {
    if (!editing) return;
    dropDraft(editing.id);
    dirty = false;
    lastState.draft = null;
    editing = null;
    render(lastState);
  };
  $('remove').onclick = () => $('confirm').classList.add('show');
  $('cancelRemove').onclick = () => $('confirm').classList.remove('show');
  $('confirmRemove').onclick = () => {
    $('confirm').classList.remove('show');
    if (editing) { dropDraft(editing.id); dirty = false; send({ f: 'note', type: 'remove', id: editing.id }); }
  };
  $('deleteOrphan').onclick = () => { if (lastState.orphan) send({ f: 'note', type: 'deleteOrphan', id: lastState.orphan.id }); };
  $('startFix').onclick = startFix;
  $('cancelFix').onclick = stopFix;
  $('scanAll').onclick = () => {
    $('scanAll').textContent = t().scanning;
    $('scanAll').disabled = true;
    send({ f: 'note', type: 'scanAll' });
  };

  form = formFromNote(null);

  // Light sync so changes made by other designers show up.
  setInterval(() => { if (screen === 'note' && !dirty && !saving) send({ f: 'note', type: 'refresh' }); }, 3000);

  return { applyLang, onMessage, save };
})();

const Images = (() => {

      scopeHintSelN: (n) => 'Seçili ' + n + ' katman taranacak.',
      scopeHintNone: 'Sadece onu taramak için bir frame veya section seç.',
      scopeHintPage: 'Bu sayfadaki tüm katmanlar taranacak.',
      scopeHintDoc: 'Tüm sayfaları yükleyip tarar. Büyük dosyalarda biraz sürebilir.',
      resolution: 'Hedef çözünürlük', recommended: 'Önerilen', notRecommended: 'Önerilmez',
      scale2Title: '2x önerilmez',
      scale2Text: 'Görseller 3x telefon ekranlarında (çoğu güncel iPhone ve üst segment Android) bulanık görünebilir. Sadece tasarımın 2x’te kullanılacağından eminsen seç.',
      minSize: 'Dosya boyutu', minSizeHint: 'Sadece en az bu boyuttaki görseller listelenir. Yalnızca piksel boyutu değişir; PNG’ler PNG, JPEG’ler JPEG kalır.',
      scan: 'Tara', scanning: 'Taranıyor…',
      scanProgress: (n, tot) => n + ' / ' + tot + ' katman tarandı…',
      applyProgress: (n, tot) => n + ' / ' + tot + ' görsel optimize edildi…',
      counts: (n) => '<b>' + n + '</b> sonuç',
      countsGain: (gn) => ' · tahmini kazanç <b class="gain">' + gn + '</b>',
      selectAll: 'Tümünü seç', selectNone: 'Temizle',
      uses: (n) => n + ' kullanım',
      useOf: (i, n) => n + ' kullanımdan ' + i + '.',
      goTo: 'Katmana git', goToNext: 'Sonraki kullanım için tekrar tıkla',
      noGain: 'Kazanç yok',
      empty: 'Optimize edilecek görsel yok 🎉',
      emptyHint: 'Daha düşük bir dosya boyutu eşiği ya da daha geniş bir kapsam dene.',
      selInfo: (n, gn) => n + ' seçili · ~' + gn + ' kazanç',
      apply: (n) => n + ' görseli optimize et',
      applying: 'Optimize ediliyor…',
      doneTitle: (n, saved) => n + ' görsel optimize edildi, ' + saved + ' kazanıldı',
      doneSkipped: (n) => n + ' görsel atlandı (küçültmek boyutu düşürmedi). ',
      doneFailed: (n) => n + ' katman düzenlenemedi (kütüphane bileşeni olabilir). ',
      doneUndo: '⌘Z / Ctrl+Z ile geri alabilirsin. Kontrol için yeniden tara.',
      errTitle: 'Bir hata oluştu'
    }
  };

  const t = () => S[lang];
  let prefs = { scale: 3, minSize: 102400 };
  let scope = 'page';
  let selection = { count: 0, container: false, name: null };
  let items = null;          // null = not scanned yet. Each: scan data + { newBytes, thumb, cursor }
  let checked = new Set();
  let busy = null;           // 'scan' | 'apply' | null
  let result = null;         // last apply-result / error, shown in a banner
  const rows = new Map();    // hash -> row element
  const resized = new Map(); // 'hash@WxH' -> resized bytes, measured during preview and reused on apply

  const size = (b) => b >= 1048576 ? (b / 1048576).toFixed(b >= 10485760 ? 0 : 1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';

  // Measured saving once the preview has run, otherwise a guess from the pixel count.
  function gainOf(it) {
    if (it.newBytes != null) return Math.max(0, it.bytes - it.newBytes);
    return Math.round(it.bytes * (1 - (it.targetW * it.targetH) / (it.imgW * it.imgH)));
  }

  function savePrefs() { send({ f: 'images', type: 'setPrefs', prefs }); }

  // ---------- Controls ----------

  function setSeg(id, value) {
    root.querySelectorAll('#io-' + id + ' button').forEach((b) => b.classList.toggle('on', b.dataset.v === String(value)));
  }

  function renderControls() {
    setSeg('scope', scope);
    root.querySelector('#io-scope [data-v=selection]').disabled = !selection.count;
    $('scopeHint').textContent = scope === 'selection'
      ? (selection.name ? t().scopeHintSel(selection.name) : t().scopeHintSelN(selection.count))
      : !selection.count && scope === 'page' ? t().scopeHintNone
      : scope === 'page' ? t().scopeHintPage : t().scopeHintDoc;

    setSeg('scale', prefs.scale);
    $('scaleWarn').classList.toggle('show', prefs.scale === 2);
    setSeg('minSize', prefs.minSize);

    $('scan').textContent = busy === 'scan' ? t().scanning : t().scan;
    $('scan').disabled = !!busy || (scope === 'selection' && !selection.count);
  }

  function onSelection(m) {
    selection = m;
    if (!m.focused) { // ignore the selection we made ourselves when jumping to a layer
      if (m.container && scope !== 'selection') scope = 'selection';
      else if (!m.count && scope === 'selection') scope = 'page';
    }
    renderControls();
  }

  // ---------- Results ----------

  function renderResults() {
    const cl = root.classList;
    cl.toggle('has-results', items !== null);
    cl.toggle('has-items', !!(items && items.length));

    const banner = $('resultBanner');
    banner.className = 'banner' + (result ? ' show ' + (result.error ? 'err' : 'ok') : '');
    if (result && result.error) {
      $('resultTitle').textContent = t().errTitle;
      $('resultText').textContent = result.error;
    } else if (result) {
      $('resultTitle').textContent = t().doneTitle(result.done, size(result.savedBytes));
      $('resultText').textContent = (result.skipped ? t().doneSkipped(result.skipped) : '') +
        (result.failedNodes ? t().doneFailed(result.failedNodes) : '') + t().doneUndo;
    }

    rows.clear();
    if (items === null) return;
    const list = $('list');
    list.innerHTML = '';
    $('toggle').style.display = items.length ? '' : 'none';

    if (!items.length) {
      renderCounts();
      const d = document.createElement('div');
      d.className = 'empty';
      d.innerHTML = '<div></div><div class="hint"></div>';
      d.firstChild.textContent = t().empty;
      d.lastChild.textContent = t().emptyHint;
      list.append(d);
      return;
    }

    items.forEach((it) => {
      const row = document.createElement('div');
      row.className = 'entry';
      row.innerHTML = '<input type="checkbox"><div class="thumb"></div>' +
        '<div class="meta"><div class="name"></div><div class="sub dims"></div><div class="sub uses"></div></div>' +
        '<div class="side"><div class="size"></div><div class="gain"></div></div>';
      const box = row.querySelector('input');
      box.onchange = () => { box.checked ? checked.add(it.hash) : checked.delete(it.hash); renderCounts(); };
      row.querySelector('.meta').onclick = row.querySelector('.thumb').onclick = () => goTo(it);
      row.querySelector('.dims').textContent = it.imgW + '×' + it.imgH + ' → ' + it.targetW + '×' + it.targetH +
        (it.format ? ' · ' + it.format : '');
      row.querySelector('.size').textContent = size(it.bytes);
      rows.set(it.hash, row);
      list.append(row);
      renderRow(it);
    });
    renderCounts();
  }

  function renderRow(it) {
    const row = rows.get(it.hash);
    if (!row) return;
    const n = it.nodes.length;
    // After a click, the row shows the use that was just selected; before that, the first one.
    const shown = it.cursor ? it.nodes[(it.cursor - 1) % n] : it.nodes[0];
    row.querySelector('.name').textContent = shown.name;
    row.querySelector('.uses').textContent =
      (it.cursor && n > 1 ? t().useOf(((it.cursor - 1) % n) + 1, n) : t().uses(n)) + ' · ' + shown.page;
    row.querySelector('.meta').title = n > 1 ? t().goTo + ' · ' + t().goToNext : t().goTo;
    row.querySelector('input').checked = checked.has(it.hash);

    const thumb = row.querySelector('.thumb');
    thumb.classList.toggle('loading', !it.thumb);
    if (it.thumb && !thumb.firstChild) {
      const img = document.createElement('img');
      img.src = it.thumb;
      thumb.append(img);
    }

    const gain = row.querySelector('.gain');
    const noGain = it.newBytes != null && it.newBytes >= it.bytes;
    row.classList.toggle('no-gain', noGain);
    gain.className = 'gain' + (noGain ? ' none' : it.newBytes == null ? ' est' : '');
    gain.textContent = noGain ? t().noGain : (it.newBytes == null ? '~' : '') + '−' + size(gainOf(it));
  }

  function renderCounts() {
    if (!items) return;
    const total = items.reduce((s, i) => s + gainOf(i), 0);
    $('counts').innerHTML = t().counts(items.length) + (items.length ? t().countsGain('~' + size(total)) : '');
    if (!items.length) return;
    const sel = items.filter((i) => checked.has(i.hash));
    $('selInfo').textContent = t().selInfo(sel.length, size(sel.reduce((s, i) => s + gainOf(i), 0)));
    $('apply').textContent = busy === 'apply' ? t().applying : t().apply(sel.length);
    $('apply').disabled = !!busy || !sel.length;
    $('toggle').textContent = sel.length === items.length ? t().selectNone : t().selectAll;
  }

  // Each click selects the next use of the same image.
  function goTo(it) {
    const node = it.nodes[(it.cursor || 0) % it.nodes.length];
    it.cursor = (it.cursor || 0) + 1;
    send({ f: 'images', type: 'focus', id: node.id });
    renderRow(it);
  }

  function applyLang() {
    translate(root, t());
    renderControls();
    renderResults();
  }

  function clearResults() {
    if (items) items.forEach((i) => { if (i.thumb) URL.revokeObjectURL(i.thumb); });
    items = null;
    checked = new Set();
    resized.clear();
  }

  // ---------- Pixel work ----------

  // Step down by halves for better quality on large reductions.
  function downscale(bitmap, tw, th) {
    let src = bitmap, w = bitmap.width, h = bitmap.height;
    while (w / 2 >= tw && h / 2 >= th) {
      const c = new OffscreenCanvas(Math.round(w / 2), Math.round(h / 2));
      const ctx = c.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(src, 0, 0, c.width, c.height);
      src = c; w = c.width; h = c.height;
    }
    const out = new OffscreenCanvas(tw, th);
    const ctx = out.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(src, 0, 0, tw, th);
    return out;
  }

  // Keeps the original format. JPEGs have to be re-encoded after resizing; a high quality keeps that invisible.
  async function encode(bitmap, targetW, targetH, format) {
    const canvas = downscale(bitmap, targetW, targetH);
    const blob = format === 'JPEG'
      ? await canvas.convertToBlob({ type: 'image/jpeg', quality: 0.92 })
      : await canvas.convertToBlob({ type: 'image/png' });
    return new Uint8Array(await blob.arrayBuffer());
  }

  async function thumbnail(bitmap) {
    const s = Math.min(1, 96 / Math.max(bitmap.width, bitmap.height));
    const c = downscale(bitmap, Math.max(1, Math.round(bitmap.width * s)), Math.max(1, Math.round(bitmap.height * s)));
    return URL.createObjectURL(await c.convertToBlob({ type: 'image/png' }));
  }

  const key = (m) => m.hash + '@' + m.targetW + 'x' + m.targetH;

  // Draws the thumbnail and measures the real size after resizing (kept for when the user applies).
  async function preview(m) {
    let newBytes = null, thumb = null;
    try {
      const bmp = await createImageBitmap(new Blob([m.bytes]));
      thumb = await thumbnail(bmp);
      const out = await encode(bmp, m.targetW, m.targetH, m.format);
      resized.set(key(m), out);
      newBytes = out.length;
    } catch (e) {}
    send({ f: 'images', type: 'previewed', hash: m.hash });
    const it = items && items.find((i) => i.hash === m.hash);
    if (!it) { if (thumb) URL.revokeObjectURL(thumb); return; }
    it.thumb = thumb;
    it.newBytes = newBytes;
    if (newBytes != null && newBytes >= it.bytes) checked.delete(it.hash);
    renderRow(it);
    renderCounts();
  }

  async function resize(m) {
    try {
      let out = resized.get(key(m));
      if (!out) out = await encode(await createImageBitmap(new Blob([m.bytes])), m.targetW, m.targetH, m.format);
      send({ f: 'images', type: 'resized', hash: m.hash, bytes: out });
    } catch (e) {
      send({ f: 'images', type: 'resized', hash: m.hash, bytes: null });
    }
  }

  // ---------- Messages ----------

  function onMessage(m) {
    if (m.type === 'prefs') {
      const p = m.prefs || {};
      if ([2, 3, 4].indexOf(p.scale) !== -1) prefs.scale = p.scale;
      if ([102400, 512000, 1048576].indexOf(p.minSize) !== -1) prefs.minSize = p.minSize;
      renderControls();
    } else if (m.type === 'selection') {
      onSelection(m);
    } else if (m.type === 'progress') {
      $('status').textContent = m.phase === 'scan' ? t().scanProgress(m.n, m.total) : t().applyProgress(m.n, m.total);
    } else if (m.type === 'preview') {
      preview(m);
    } else if (m.type === 'resize') {
      resize(m);
    } else if (m.type === 'scan-result') {
      busy = null;
      items = m.items.map((i) => Object.assign(i, { newBytes: null, thumb: null, cursor: 0 }));
      checked = new Set(items.map((i) => i.hash));
      $('status').textContent = '';
      renderControls();
      renderResults();
    } else if (m.type === 'apply-result') {
      busy = null;
      result = m;
      clearResults();
      $('status').textContent = '';
      renderControls();
      renderResults();
    } else if (m.type === 'error') {
      busy = null;
      result = { error: m.text };
      $('status').textContent = '';
      renderControls();
      renderResults();
    }
  }

  // ---------- Events ----------

  root.querySelectorAll('#io-scope button').forEach((b) => {
    b.onclick = () => { scope = b.dataset.v; renderControls(); };
  });
  root.querySelectorAll('#io-scale button').forEach((b) => {
    b.onclick = () => { prefs.scale = Number(b.dataset.v); savePrefs(); renderControls(); };
  });
  root.querySelectorAll('#io-minSize button').forEach((b) => {
    b.onclick = () => { prefs.minSize = Number(b.dataset.v); savePrefs(); renderControls(); };
  });

  $('scan').onclick = () => {
    busy = 'scan';
    result = null;
    clearResults();
    $('status').textContent = '';
    renderControls();
    renderResults();
    send({ f: 'images', type: 'scan', scope, scale: prefs.scale, minBytes: prefs.minSize });
  };

  $('toggle').onclick = () => {
    const all = items.every((i) => checked.has(i.hash));
    checked = new Set(all ? [] : items.map((i) => i.hash));
    items.forEach(renderRow);
    renderCounts();
  };

  $('apply').onclick = () => {
    const hashes = items.filter((i) => checked.has(i.hash)).map((i) => i.hash);
    if (!hashes.length) return;
    busy = 'apply';
    renderControls();
    renderCounts();
    send({ f: 'images', type: 'apply', hashes });
  };

  return { applyLang, onMessage };
})();

  };
